kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
{{- if .RegistryConfigDir }}
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
{{- end }}
{{- if .PrivateRegistry }}
containerdConfigPatches:
- |-
  # FIXME deprecated replace with https://github.com/kubernetes-sigs/kind/issues/3310#issuecomment-1641515799
  [plugins."io.containerd.grpc.v1.cri".registry.configs."{{ .PrivateRegistry }}".tls]
     insecure_skip_verify = true
{{- end }}
{{- if .Cni }}
networking:
  disableDefaultCNI: true # disable kindnet
  podSubnet: "192.168.0.0/16"
{{- end }}
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta3
    kind: ClusterConfiguration
    metadata:
      name: config
    apiServer:
      extraArgs:
        enable-admission-plugins: NodeRestriction,ResourceQuota
    {{- if .AuditPolicy }}
        # enable auditing flags on the API server
        audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
        audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
      # mount new files / directories on the control plane
      extraVolumes:
        - name: audit-policies
          hostPath: /etc/kubernetes/policies
          mountPath: /etc/kubernetes/policies
          readOnly: true
          pathType: "DirectoryOrCreate"
        - name: "audit-logs"
          hostPath: "/var/log/kubernetes"
          mountPath: "/var/log/kubernetes"
          readOnly: false
          pathType: DirectoryOrCreate
    {{- end }}
    {{- if .LocalCertSANs }}
      certSANs:
        - "127.0.0.1"
	{{- end }}
  {{- if or .ExtraMountPath .AuditPolicy .RegistryConfigDir }}
  extraMounts:
  {{- if .ExtraMountPath }}
  - hostPath: {{ .ExtraMountPath }}
    containerPath: /mnt/extra
  {{- end }}
  {{- if .AuditPolicy }}
  - hostPath: {{ .AuditPolicy }}
    containerPath: /etc/kubernetes/policies/audit-policy.yaml
    readOnly: true
  {{- end }}
  {{- if .RegistryConfigDir }}
  - hostPath: {{ .RegistryConfigDir }}
    containerPath: /etc/containerd/certs.d
    readOnly: true
  {{- end }}
  {{- end }}
{{- range $val := Iterate .Workers }}
- role: worker
  {{- if or $.ExtraMountPath $.RegistryConfigDir }}
  extraMounts:
  {{- if $.ExtraMountPath }}
  - hostPath: {{ $.ExtraMountPath }}
    containerPath: /mnt/extra
  {{- end }}
  {{- if $.RegistryConfigDir }}
  - hostPath: {{ $.RegistryConfigDir }}
    containerPath: /etc/containerd/certs.d
    readOnly: true
  {{- end }}
  {{- end }}
{{- end }}
